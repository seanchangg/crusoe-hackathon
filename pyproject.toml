[project]
name = "donedone"
version = "0.1.0"
description = "Goal -> verifiable evals -> self-provisioned, self-verifying agent loop on Crusoe Managed Inference"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.117",
    "openai>=1.60",
    "pydantic>=2.9",
    "httpx>=0.27",
    "vercel>=0.1",
    "python-dotenv>=1.0",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "playwright>=1.64.0",
    "pytest>=8",
    "uvicorn>=0.30",
]

[tool.vercel]
entrypoint = "app:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
